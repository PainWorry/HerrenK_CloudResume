name: Deploy Backend Infrastructure (Terraform)

on:
  push:
    # This is the most important part!
    # This workflow *only* runs when files in the 'infra/' folder are changed.
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Terraform
      # This action installs Terraform for us
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.13.5 # The same version you have

      # 3. Configure AWS Credentials
      # This uses the same secrets as your frontend workflow
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 4. Terraform Init
      # Runs 'terraform init' in your infra folder
      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ./infra

      # 5. Terraform Validate
      # Checks your .tf files for syntax errors
      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: ./infra

      # 6. Terraform Apply
      # Runs 'terraform apply' automatically
      # The '-auto-approve' means it won't ask "yes"
      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: ./infra